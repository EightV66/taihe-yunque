<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%239e2820'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='36' fill='%23f5c84c' font-family='serif'>阙</text></svg>" />
  <title>太和云阙 · 3D体素中国古典建筑群</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #161019;
      font-family: "PingFang SC", "Microsoft YaHei", "STKaiti", "KaiTi", serif;
      color: #f6ecd9;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Top Left Title Plaque */
    .hud-header {
      position: fixed;
      top: 20px;
      left: 24px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .title-card {
      background: linear-gradient(135deg, rgba(32, 18, 16, 0.85) 0%, rgba(18, 12, 14, 0.78) 100%);
      border: 1px solid rgba(226, 179, 103, 0.45);
      border-left: 4px solid #d99b38;
      border-radius: 6px;
      padding: 12px 18px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }

    .title-main {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #f8e3b4;
      text-shadow: 0 2px 8px rgba(217, 155, 56, 0.4);
    }

    .title-seal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #a8241c;
      color: #fff6e5;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid rgba(255, 215, 150, 0.5);
      letter-spacing: 1px;
    }

    .title-sub {
      margin-top: 4px;
      font-size: 12px;
      color: rgba(246, 236, 217, 0.75);
      letter-spacing: 1px;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    /* Top Right Stats Badge */
    .hud-stats {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 10;
      display: flex;
      gap: 10px;
      background: rgba(20, 14, 15, 0.76);
      border: 1px solid rgba(226, 179, 103, 0.35);
      border-radius: 6px;
      padding: 8px 14px;
      backdrop-filter: blur(8px);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 12px;
      color: #e6d5b8;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .stat-label {
      color: rgba(230, 213, 184, 0.62);
    }

    .stat-value {
      color: #f5c36c;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .stat-divider {
      width: 1px;
      height: 14px;
      background: rgba(226, 179, 103, 0.25);
      align-self: center;
    }

    /* Bottom Control Dock */
    .hud-dock {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(180deg, rgba(28, 18, 17, 0.88) 0%, rgba(16, 11, 12, 0.92) 100%);
      border: 1px solid rgba(226, 179, 103, 0.42);
      border-radius: 10px;
      padding: 10px 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.55);
      max-width: 95vw;
    }

    .dock-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dock-label {
      font-size: 12px;
      color: rgba(245, 216, 166, 0.72);
      margin-right: 4px;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      white-space: nowrap;
    }

    .dock-divider {
      width: 1px;
      height: 22px;
      background: rgba(226, 179, 103, 0.25);
      margin: 0 2px;
    }

    .hud-btn {
      appearance: none;
      background: rgba(255, 238, 205, 0.07);
      border: 1px solid rgba(226, 179, 103, 0.28);
      color: #ebdBBC;
      padding: 6px 12px;
      border-radius: 5px;
      font-size: 12.5px;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .hud-btn:hover {
      background: rgba(217, 155, 56, 0.22);
      border-color: rgba(245, 195, 108, 0.65);
      color: #fff5e0;
      transform: translateY(-1px);
    }

    .hud-btn.active {
      background: linear-gradient(135deg, #b83327 0%, #8f1f16 100%);
      border-color: #f3c169;
      color: #fff8eb;
      box-shadow: 0 2px 10px rgba(184, 51, 39, 0.45);
      font-weight: 600;
    }

    /* Controls hint on bottom right */
    .hud-hint {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 10;
      background: rgba(20, 14, 15, 0.72);
      border: 1px solid rgba(226, 179, 103, 0.28);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 11.5px;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: rgba(235, 219, 188, 0.72);
      pointer-events: none;
      backdrop-filter: blur(6px);
    }

    /* Loading Screen */
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(circle at center, #261515 0%, #110b0d 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-title {
      font-size: 28px;
      letter-spacing: 6px;
      color: #f5d393;
      font-weight: 700;
    }

    .loader-sub {
      font-size: 13px;
      color: rgba(245, 211, 147, 0.7);
      letter-spacing: 2px;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .loader-bar-wrap {
      width: 240px;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      overflow: hidden;
    }

    .loader-bar {
      width: 65%;
      height: 100%;
      background: linear-gradient(90deg, #b83327, #f5c36c);
      animation: pulseBar 1.2s infinite ease-in-out;
    }

    @keyframes pulseBar {
      0% { transform: translateX(-60%); }
      100% { transform: translateX(140%); }
    }

    @media (max-width: 1080px) {
      .hud-hint { display: none; }
      .hud-dock { bottom: 12px; padding: 8px 10px; gap: 6px; }
    }
